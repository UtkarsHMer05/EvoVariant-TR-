# Deterministic split policy for the ML extension.
# The locked temporal cohort is never generated by this file; it is referenced
# by the original frozen protocol and is kept separate from development data.

policy_id: evovariant-tr-development-split-v1
version: "1.0.0"
protocol_id: evovariant-tr-ml-extension
seed: 20260814
assembly: GRCh38
normalized_id_key: normalized_variant_id
group_key: gene_symbol
group_mode: gene_grouped
split_order:
  - TRAIN
  - VALIDATION
  - LOCKED_TEST
fractions:
  TRAIN: 0.8
  VALIDATION: 0.2
  LOCKED_TEST: 0.0
source_cutoff:
  development_labels_available_on_or_before: "2025-01-02"
  locked_test_t0: "2025-01-02"
  locked_test_t1: "2026-08-06"
rules:
  - normalize_before_deduplication
  - deduplicate_by_normalized_variant_id
  - reject_locked_test_ids_from_train_and_validation
  - assign_whole_genes_to_one_development_split
  - stratify_class_as_feasible_without_breaking_gene_groups
  - preserve_unresolved_and_excluded_counts_in_flow_report
  - write_manifest_sha256_after_assignment
required_manifest_fields:
  - normalized_variant_id
  - assembly
  - chromosome
  - position_1based
  - reference
  - alternate
  - gene_symbol
  - label
  - split
  - source_release
  - source_record_hash
invariants:
  - no_normalized_id_overlap
  - no_train_validation_gene_overlap
  - no_development_locked_test_overlap
  - deterministic_rebuild_for_same_input_and_seed
