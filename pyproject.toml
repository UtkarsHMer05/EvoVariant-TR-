[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evovariant-tr"
version = "0.1.0"
description = "EvoVariant-TR: temporal-generalization benchmark for frozen zero-shot Evo 2 allele-likelihood scoring of ClinVar VUS resolution"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "EvoVariant-TR contributors" }]
# Core scientific dependencies only. GPU/cloud/plotting packages live in extras
# so the local core environment installs without CUDA.
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
modal = ["modal>=0.64"]
plotting = ["matplotlib>=3.9", "seaborn>=0.13"]
comparators = ["pandas>=2.2", "numpy>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyarrow>=17",
    "jsonschema>=4.23",
]

[project.scripts]
evovariant-tr = "evovariant_tr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default runs exclude anything that can cost money or take a long time.
# Gated tiers require an explicit flag (see tests/conftest.py):
#   modal      -> --run-modal AND EVOVARIANT_TR_PAID_COMPUTE_ACK=I_ACCEPT_COSTS
#   scientific -> --run-scientific
#   e2e        -> --run-e2e
addopts = "-q -m \"not modal and not scientific and not e2e\""
markers = [
    "modal: tests that use Modal / paid GPU compute (gated, never run by default)",
    "scientific: slow scientific validation tests (gated, never run by default)",
    "e2e: end-to-end browser tests (gated, land at Milestone 97)",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["evovariant_tr"]

[tool.coverage.report]
# Minimum quality gate for core deterministic modules.
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise RuntimeError",
    "if not EV2_AVAILABLE",
    "import modal",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["evovariant_tr"]
strict = true
ignore_missing_imports = true
